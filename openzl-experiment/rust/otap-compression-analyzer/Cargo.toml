[package]
name = "otap-compression-analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
otel-arrow-rust = { path = "../../../rust/otel-arrow-rust" }
openzl = { path = "../openzl" }

arrow-ipc = "56.1"
zstd = "0.13"

tokio = { version = "1.0", features = ["full"] }
tonic = "0.14"
prost = "0.14"
tokio-stream = "0.1"
futures = "0.3"

tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }